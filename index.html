<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#183e38"><title>Meridian · Family world clock</title>
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icons/192.png"><link rel="apple-touch-icon" href="./icons/180.png"><link rel="stylesheet" href="./style.css"><script defer src="./time.js"></script><script defer src="./scenery.js"></script><script defer src="./app.js"></script></head>
<body><header><div class="wrap mast"><div class="brand"><span class="globe" aria-hidden="true">◎</span> Meridian</div><button id="theme" class="soft">Dark mode</button></div></header>
<main class="wrap"><section aria-labelledby="title"><div class="intro"><div><div class="status"><i></i><span id="state">Live clocks</span></div><h1 id="title">World clock</h1></div><button class="primary" id="set">Set time <b aria-hidden="true">↗</b></button></div><div class="cards" id="cards"></div><p id="dst" class="notice" hidden></p></section>
<div class="panels"><section class="box"><h2>Time planner</h2><p class="sub" id="basis"></p><label class="sr" for="slide">Adjust time up to 24 hours either way</label><input type="range" id="slide" min="-1440" max="1440" step="1" value="0"><div class="ends"><span>−24 hours</span><span>+24 hours</span></div><div class="steps" id="steps"></div></section>
<section class="box available"><div class="eyemark" aria-hidden="true">◷</div><h2>Everyone is available</h2><p id="windows"></p><button id="next">Next available time <span aria-hidden="true">→</span></button></section></div>
<details class="box more"><summary>More options</summary><div class="options"><label>Availability range<select id="range"><option value="awake">Awake · 07:00–23:00</option><option value="comfortable">Comfortable · 09:00–21:00</option><option value="work">Work hours · 09:00–17:00</option></select></label><label><input type="checkbox" id="format"> 24-hour clock</label><label><input type="checkbox" id="large"> Large text</label><button id="copy">Copy all times</button><button id="share">Copy time link</button><button id="cal">Add to calendar</button></div></details>
<section class="box schedule"><h2>24-hour view</h2><p class="sub" id="tableDate"></p><div class="scroll" tabindex="0" aria-label="Scrollable hourly comparison"><table><thead><tr><th>Ontario</th><th>Kerala</th><th>Dubai</th><th>New York</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<dialog id="dlg"><form id="form"><h2>Set the time</h2><label>Place<select id="city"></select></label><label>Local date<input id="date" type="date" required min="1900-01-01" max="2099-12-31"></label><label>Local time<input id="time" type="time" required step="60"></label><label id="repeat" hidden>Repeated hour<select id="occ"><option value="0">First occurrence</option><option value="1">Second occurrence</option></select></label><p id="err" role="status"></p><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary">Set time</button></div></form></dialog><div id="toast" role="status"></div><dialog id="fallback"><label>Copy this text<textarea id="manual" readonly></textarea></label><button id="closeCopy">Close</button></dialog></body></html>
